model:
  model_type: performance-rnn
  output_transforms:
    - folk_rnn_inv:
    - abc_midi:
  params:
    vocab_size: 413
    num_layers: 3
    lstm_size: 512
    #dropout: 0.5
    embedding_size: null
    lr: 0.001
    #lr_decay: 0.97
    #lr_decay_start: 20

dataloaders:
  validation:
    name: "lakh"
    root: "_data"
    split: "test"
    download: True
    transforms:
      - midi_tokenizer:
          tokenizer_params:
            tokenization: midilike
            pitch_range: [0, 127]
            vocab_size: 413 
            max_duration: 
            #max_bar_length: 16  # Each bar has 16 events (16th notes)
            #num_bars: 16  # Total number of bars for hierarchical model
            #hierarchical: True  # Use hierarchical modeling
            #bar_token_count: 16  # Each subsequence corresponds to a single bar
            #beat_resolution: 4  # 16th note intervals (4 intervals per beat in 4/4 time)
            note_on_count: 128
            note_off_count: 128
            num_velocities: 32
            num_bars: 

      - sample_subsequence:
          subsequence_len: 256
      - toksequence_to_tensor:

    batch_size: 64
    num_workers: 16
    collate_fn: "pad_collate_single_sequence"

  train:
    - dataset:
        name: "lakh"
        root: "_data"
        split: "train"
        download: True
        transforms:
          - midi_tokenizer:
              tokenizer_params:
                TODO: todo
          - sample_subsequence:
              subsequence_len: 256
          - toksequence_to_tensor:
        
        batch_size: 64
        num_workers: 16
        collate_fn: "pad_collate_single_sequence"

lightning:
  trainer:
    benchmark: True
    max_epochs: 100
    gradient_clip_algorithm: "value"
    gradient_clip_val: 5

callbacks:
  - model_checkpoint:
      filename: "{epoch:06}"
      verbose: True
      save_last: True
  - checkpoint_every_n_steps:
      save_step_frequency: 1000
      prefix: "N-Step-Checkpoint"
      use_modelcheckpoint_filename: False
  - setup_callback:
  - cuda_callback:
